name: Aggregate mod stats

on:
  issues:
    types: [opened, edited, reopened, closed, deleted]
  workflow_dispatch:

concurrency:
  group: mod-stats
  cancel-in-progress: true

permissions:
  contents: write
  issues: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggregate votes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/aggregate_mod_stats.py

      - name: Commit stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- stats.json)" ]; then
            echo "stats.json is unchanged"
            exit 0
          fi
          git add stats.json
          git commit -m "chore(stats): update community stats"
          git push
