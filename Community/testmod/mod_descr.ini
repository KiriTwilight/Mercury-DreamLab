; Mercury DreamLab 模组描述文件 | Mod descriptor
; ---------------------------------------------------------------
; 复制本模板到 Community/<你的模组目录>/，并保证目录里存在 mod_descr.ini。
; MUL 启动时会扫描 Official/ 与 Community/ 下的每个 mod_descr.ini，
; 并把这里的内容显示到 DreamLab 列表与详情页。
;
; 语法：
;   [section]  分区
;   key=value  键值，分号 ; 或井号 # 开头为注释
;   [summary] / [description]  之后的所有行都会作为文本原样读取。
; ---------------------------------------------------------------

[mod]
; 显示名称（必填）
name=测试模组
; 创作者 / 团队（必填）
author=Kiri Bananakat
; 分类，只能填：画面 材质 天气 武器 界面 音频 玩法 工具
category=玩法
; 版本号与发布/更新日期
version=1.0.0alpha
released=2026-11-20
; 安装包大小（可选，用于展示）
size=666MB
; 是否为 DLC / 扩展内容（true / false）
dlc=false
; 是否为编辑器类组件（true / false，分类建议填「工具」）
editor=false
; 依赖的其他模组名称，用分号或逗号分隔；没有依赖就留空
dependencies=Mercury Engine 0.7.3beta; Mercury Universal Editor

[links]
; 仅允许两个自定义跳转页面，留空则回退到模组对应的 GitHub 地址。
; 下载页：可以指向百度云、OneDrive、GitHub Releases 等页面
download=https://github.com/KiriTwilight/Mercury-DreamLab
; 作者主页：可以指向 B 站、个人博客、GitHub 主页等
author=https://space.bilibili.com/183591594

[summary]
这一段是summary，60字以内，有啥想多说的写description。

[description]
这里是详细的description，想些啥就多写点儿。

空行会被保留，MUL 会原样显示在详情页的「详细介绍」区域。

建议写清安装内容、改动范围、已知限制与兼容性。
